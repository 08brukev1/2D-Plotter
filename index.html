<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robotic Arm AI Control</title>
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css" />

  <!--Font-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<!------------------------------Body --------------------------->

<body>
  <!-- Sidebar -->
  <aside id="sidebar">
    <button id="toggleBtn" class="btn btn-outline-secondary m-3">
      <i class="bi bi-list"></i>
    </button>

    <button id="newChatBtn" class="new-chat-btn">
      <i class="bi bi-plus-lg"></i>
      New Chat
    </button>

    <!-- <div class="mt-5 pt-4">SideBar for Old Chats and so on</div> -->

    <!-- Account area -->
    <div id="Account" class="account-section">
      <div class="account-label">ACCOUNT</div>
      <div class="account-div">
        <span class="profile-icon">
          <i class="bi bi-person"></i>
        </span>
        <button id="ProfileBtn" class="AccountBtn">Profile</button>
      </div>
      <div class="account-div">
        <span class="setting-icon">
          <i class="bi bi-gear"></i>
        </span>
        <button class="AccountBtn">Settings</button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main id="mainContent">
    <button id="openSidebarBtn" class="btn btn-outline-secondary m-3" style="display: none">
      <!-- for the bootstrap-icons -->
      <i class="bi bi-list"></i>
    </button>

    <div id="chatHistory"></div>

    <div class="textarea">
      <h3>Please Input ur Prompt!</h3>
      <!--wrapper to "constrain" everything-->
      <div class="textarea-wrapper">
        <!--where prompt is input-!--where prompt is input-->
        <textarea name="Prompt" placeholder="Prompt the Arm to move!" cols="65" rows="4"></textarea>
        <button id="sendMsg">
          <i class="bi bi-arrow-right"></i>
        </button>
        <div id="moreFeatures" role="button" tabindex="0">
          <div id="featurediv" class="hideFeatures">
            <ul id="features">
              <li>
                <button id="resetButton" class="btn btn-outline-secondary">
                  reset
                </button>
              </li>
              <li>2</li>
              <li>3</li>
              <li>4</li>
            </ul>
          </div>
          <i class="bi bi-plus"></i>
        </div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
  <!--for sending the prompt-->
  <script src="js/prompt.js"></script>
  <!--for resetting the arm-->
  <script src="js/reset.js"></script>
  <!--for google sign in-->
  <script src="https://apis.google.com/js/platform.js" async defer></script>
</body>

</html>
